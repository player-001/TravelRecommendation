<!DOCTYPE html>
<html>
    <head>
        <title>Contact Us</title>
        <link rel = "stylesheet" href = "./travel_recommendation.css">
        <style>
            form input, form textarea, form button{
                width: 90%;
                margin: 0.2rem;
            }
            form{
                padding: 0.5rem;
                background-color:gray;
                width: 35%;
            }
            button{
                background-color: lightblue;
                padding: 0.5rem;
            }
            input{
                padding: 0.4rem;
            }
            
        </style>
    </head>

    <body>
        <img src = "https://images.pexels.com/photos/131723/pexels-photo-131723.jpeg" width = "100%" height = "100%" class = "background_img">
        <nav>
            <h2>TravelBloom</h2>
            <ul>
                <li><a href = "./index.html">Home</a></li>
                <li><a href = "./about_us.html">About Us</a></li>
                <li><a href = "./contact_us.html">Contact Us</a></li>
            </ul>
        </nav>

        <h1 class = "white_larger">Contact Us</h1>
        <form>
            <label for = "name" class = "white_large">Name: </label><br>
            <input id = "name" type = "text" width = "60"><br>
            <label for = "email" class = "white_large">Email: </label><br>
            <input type = "email" id = "email" required><br>
            <label for = "message" class = "white_large">Message:</label><br>
            <textarea id = "message" rows = "10"></textarea><br>
            <button type = "submit" id = "formSubmit">Submit</button>
        </form>
    </body>
    <script>
        var submitBttn = document.getElementById("formSubmit")
        submitBttn.addEventListener("click", () => {
            alert("Thank you for Contacting Us!")
        })
    </script>
</html>
